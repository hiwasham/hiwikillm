topic: "Architecture for integrating an Obsidian 20,000-note vault, GBrain, wikillm, Firecrawl, and adjacent knowledge-management tools"
current_date: "2026-07-08"
context:
  user_profile: "Long-term Obsidian user with about 20,000 notes, building an agentic coding and personal knowledge-management system."
  local_project: "/root/projects/hiwikillm"
  package: "/root/projects/hiwikillm/wikillm"
  package_summary: "wikillm ingests URLs, YouTube links, GitHub repositories, PDFs, local files, and text; distills them into structured Markdown; indexes them with Milvus; extracts wikilinks; and exposes CLI/Telegram Q&A."
  gbrain_summary: "GBrain is installed locally and should be evaluated as a persistent retrieval, graph, MCP, and agent-memory layer over Markdown, code, and generated notes."
  firecrawl_summary: "Firecrawl API key is available as FIRECRAWL_API_KEY and should be evaluated for crawl, scrape, extraction, monitoring, and deep-research workflows."
constraints:
  - "Obsidian should remain the canonical human editing and reading workspace unless research proves otherwise."
  - "The existing 20,000-note Obsidian vault must not be mass-rewritten by automation."
  - "Markdown portability, wikilinks, and existing note structure matter."
  - "Private notes and secrets must stay local."
  - "wikillm private runtime state under config.toml, data/, notes/, sources/, and todos/ must not be committed."
  - "GBrain and wikillm should complement each other instead of duplicating every feature."
  - "Prefer recoverable, inspectable workflows over fragile opaque automation."
  - "The result should support agentic coding workflows safely."
research_questions:
  - "What should be the source of truth: Obsidian, GBrain, wikillm, or a layered combination?"
  - "Should the 20,000-note Obsidian vault be indexed by GBrain, wikillm, both, or neither?"
  - "What is the safest architecture that avoids corrupting or rewriting the Obsidian vault?"
  - "What should wikillm's role be after GBrain exists?"
  - "What should GBrain's role be after wikillm exists?"
  - "How should Firecrawl integrate with wikillm and/or GBrain?"
  - "Which adjacent tools are worth adopting or avoiding?"
  - "What migration and implementation plan should be followed?"
execution:
  batch_size: 4
  items_per_agent: 1
  output_dir: "./knowledge_management_architecture_deep_research/results"
  source_policy: "Prefer official docs and primary sources. Use community sources only for adoption signals, operational issues, and failure modes."
  time_range: "Prioritize current docs and sources as of 2026-07-08; include older sources only when they explain stable architecture or historical failure modes."
items:
  - name: "Obsidian as canonical vault and human interface"
    category: "Core layer"
    description: "Research Obsidian's file model, properties/frontmatter, wikilinks, URI automation, sync/plugin behavior, and implications for safely operating on a 20,000-note vault."
    priority: "critical"
    key_sources:
      - "Obsidian official docs"
  - name: "GBrain as retrieval graph and agent memory layer"
    category: "Core layer"
    description: "Research local/official GBrain docs and CLI behavior for Markdown import, source registration, sync, schema packs, graph traversal, query/ask, MCP, and large Markdown vault handling."
    priority: "critical"
    key_sources:
      - "Local GBrain README/docs"
      - "GBrain CLI help"
      - "GBrain official repository if available"
  - name: "wikillm as capture distillation and cited Q&A pipeline"
    category: "Core layer"
    description: "Analyze wikillm's code and docs to determine its best role beside Obsidian and GBrain: source ingestion, LLM distillation, Markdown output, Milvus Q&A, Telegram/CLI, entity index, and plugin architecture."
    priority: "critical"
    key_sources:
      - "/root/projects/hiwikillm/docs"
      - "/root/projects/hiwikillm/wikillm"
  - name: "Firecrawl as web acquisition and research infrastructure"
    category: "Acquisition layer"
    description: "Research Firecrawl's scrape, crawl, map, extract, batch, change tracking, and deep-research APIs, and determine where it should replace or augment wikillm's simple URL fetcher."
    priority: "critical"
    key_sources:
      - "Firecrawl official docs"
  - name: "MCP and agent-facing interfaces"
    category: "Agent interface"
    description: "Research MCP's role for exposing capture, query, note lookup, source sync, and vault operations safely to coding agents."
    priority: "high"
    key_sources:
      - "Model Context Protocol official docs"
      - "Official MCP server references"
  - name: "Readwise Reader and highlight workflows"
    category: "Adjacent tool"
    description: "Evaluate whether Readwise Reader should be an upstream source, downstream sink, or separate workflow for articles, highlights, and reading queues."
    priority: "medium"
    key_sources:
      - "Readwise Reader API docs"
      - "Readwise Obsidian export docs"
  - name: "Zotero and academic paper workflows"
    category: "Adjacent tool"
    description: "Evaluate Zotero local/web APIs and Better BibTeX for importing papers, metadata, PDFs, annotations, and citations into wikillm, Obsidian, or GBrain."
    priority: "medium"
    key_sources:
      - "Zotero Web API docs"
      - "Better BibTeX docs"
  - name: "Search and research APIs: Exa, Tavily, Jina Reader, Linkup"
    category: "Adjacent tool"
    description: "Compare search/discovery/extraction services to Firecrawl. Identify whether any should be added, and for which exact job."
    priority: "high"
    key_sources:
      - "Exa official docs"
      - "Tavily official docs"
      - "Jina Reader official docs"
      - "Linkup official docs if relevant"
  - name: "Alternative personal knowledge and local RAG systems"
    category: "Comparator"
    description: "Evaluate tools such as Khoj, AnythingLLM, Open WebUI knowledge, LlamaIndex, LangChain, GraphRAG, Logseq, and similar systems as alternatives or complements."
    priority: "medium"
    key_sources:
      - "Official docs and repositories for each compared tool"
  - name: "Large-vault migration and operational safety"
    category: "Implementation strategy"
    description: "Research best practices for indexing, backing up, syncing, deduping, and operating on a large Markdown vault without data loss or note corruption."
    priority: "critical"
    key_sources:
      - "Obsidian docs"
      - "GBrain docs"
      - "Community failure reports only when useful"
  - name: "Security privacy and secret handling"
    category: "Risk"
    description: "Identify privacy, secret leakage, local database, sync, API-key, MCP, and agent-permission risks in the proposed system."
    priority: "critical"
    key_sources:
      - "Official security/privacy docs where available"
      - "Project AGENTS.md and wikillm config conventions"
  - name: "Concrete implementation roadmap for hiwikillm"
    category: "Output synthesis"
    description: "Turn findings into specific repo changes, docs, commands, plugins, config keys, tests, and rollout order for /root/projects/hiwikillm."
    priority: "critical"
    key_sources:
      - "All previous research items"
